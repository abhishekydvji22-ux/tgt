<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UP TGT/PGT नागरिक शास्त्र – टेस्ट</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1a1d29;--mu:#667;--pr:#4f46e5;--ok:#16a34a;--no:#dc2626;--rv:#9333ea;--bd:#d9dce8}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mu:#9aa0b8;--pr:#818cf8;--bd:#33384d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.25rem;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.t{font-weight:700;font-size:.95rem}.tm{background:var(--no);color:#fff;border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:8px 0}
.q{font-size:1.05rem;font-weight:600;margin:6px 0 12px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:11px 12px;margin:8px 0;font:inherit;cursor:pointer}
.o.s{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,var(--card))}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--card))}
.r{display:flex;gap:8px;flex-wrap:wrap}.r button,.b{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:600;background:var(--bd);color:var(--tx);cursor:pointer;margin-top:4px}
.p{background:var(--pr)!important;color:#fff!important}.m{background:var(--rv)!important;color:#fff!important}.sb{background:var(--no)!important;color:#fff!important}.wa{background:#25d366!important;color:#fff!important}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.g button{height:38px;border:0;border-radius:8px;font-weight:700;background:var(--bd);color:var(--tx);cursor:pointer}
.g .a{background:var(--ok);color:#fff}.g .v{background:var(--rv);color:#fff}.g .cur{outline:3px solid var(--pr)}
.sc{font-size:2.2rem;font-weight:800;text-align:center}.st{display:flex;justify-content:space-around;text-align:center;margin:10px 0}
input{width:100%;padding:11px;border:2px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx)}
small{color:var(--mu)}.tc{cursor:pointer}.tc b{display:block}
</style></head><body><div class="w" id="app"></div>
<script>
const T=[{"t":"नागरिक शास्त्र — वित्तीय प्रक्रिया, विशेषाधिकार, अनुदान, न्यायिक सिद्धांत व लैप्स नियम (Part 3)","q":[{"q":"राष्ट्रपति चुनाव में किसी राज्य की विधानसभा भंग होने पर क्या चुनाव स्थगित होगा?","o":["हाँ, स्थगित होगा","नहीं, चुनाव तय समय पर होगा","सुप्रीम कोर्ट तय करेगा","निर्वाचन आयोग का विवेक"],"a":1,"s":"PGT 2011","f":0},{"q":"राष्ट्रपति चुनाव के विवाद की याचिका किसके द्वारा दायर की जा सकती है?","o":["कोई भी भारतीय नागरिक","उम्मीदवार या न्यूनतम 20 मतदाता","केवल विपक्षी दल का नेता","संसद का कोई भी सदस्य"],"a":1,"s":"PGT 2013","f":0},{"q":"राष्ट्रपति के त्यागपत्र की सूचना उपराष्ट्रपति सर्वप्रथम किसे देता है?","o":["भारत के मुख्य न्यायाधीश को","लोकसभा अध्यक्ष (Speaker) को","प्रधानमंत्री को","मुख्य निर्वाचन आयुक्त को"],"a":1,"s":"TGT 2004, 2016","f":0},{"q":"मृत्युदंड को पूर्णतः क्षमा (Pardon) करने की अनन्य शक्ति किसे प्राप्त है?","o":["केवल राष्ट्रपति को","केवल राज्यपाल को","राष्ट्रपति एवं राज्यपाल दोनों को","सुप्रीम कोर्ट के CJI को"],"a":0,"s":"TGT 2021","f":1},{"q":"सैन्य न्यायालय (Court Martial) द्वारा दी गई सजा को कौन माफ कर सकता है?","o":["राज्यपाल","केवल राष्ट्रपति","रक्षा मंत्री","चीफ ऑफ डिफें स स्टाफ"],"a":1,"s":"PGT 2016","f":0},{"q":"किस वाद में SC ने कहा कि 'राष्ट्रपति की क्षमादान शक्ति न्यायिक समीक्षा योग्य है'?","o":["मारू राम वाद (1980)","के हर सिंह वाद (1989)","एपुरु सुधाकर वाद (2006)","उपर्युक्त सभी वादों में"],"a":3,"s":"PGT 2009","f":1},{"q":"राष्ट्रपति संसद के किस सदन में अपना अभिभाषण (अनु. 87) प्रस्तुत करता है?","o":["केवल लोकसभा में","केवल राज्यसभा में","दोनों सदनों की संयुक्त बैठक में","केंद्रीय कक्ष में अलग-अलग"],"a":2,"s":"TGT 2010","f":1},{"q":"राष्ट्रपति के विशेष अभिभाषण पर दोनों सदनों में कौन-सा प्रस्ताव लाया जाता है?","o":["निंदा प्रस्ताव","धन्यवाद प्रस्ताव (Motion of Thanks)","विशेषाधिकार प्रस्ताव","ध्यानाकर्षण प्रस्ताव"],"a":1,"s":"TGT 2013","f":0},{"q":"यदि लोकसभा में 'धन्यवाद प्रस्ताव' अस्वीकृत (गिर) हो जाए तो क्या परिणाम होगा?","o":["कुछ नहीं होता","सरकार को त्यागपत्र देना पड़ ता है","राष्ट्रपति पुनः भाषण देता है","स्पीकर पदमुक्त हो जाता है"],"a":1,"s":"PGT 2013","f":0},{"q":"राष्ट्रपति अध्यादेश कब जारी नहीं कर सकता है?","o":["जब दोनों सदन सत्र में हों","जब केवल लोकसभा सत्र में न हो","जब केवल राज्यसभा सत्र में हो 100 प्रश्न अभ्यास टेस्ट पेपर (Part 3)","आपातकाल के दौरान"],"a":0,"s":"TGT 2005","f":1},{"q":"संविधान संशोधन विधेयक पर राष्ट्रपति को वीटो शक्ति प्राप्त है या नहीं?","o":["हाँ, पूर्ण वीटो है","नहीं, सहमति देने हेतु बाध्य है (24वां सं.)","केवल पॉके ट वीटो है","एक बार लौटा सकता है"],"a":1,"s":"PGT 2004","f":0},{"q":"संविधान का कौन-सा अनुच्छेद कहता है कि 'भारत का एक उपराष्ट्रपति होगा'?","o":["अनुच्छेद 62","अनुच्छेद 63","अनुच्छेद 64","अनुच्छेद 65"],"a":1,"s":"TGT 2001","f":0},{"q":"उपराष्ट्रपति को हटाने हेतु 14 दिन पूर्व सूचना पर संकल्प पर कितने सदस्यों के हस्ताक्षर चाहिए?","o":["कम से कम 50 सदस्य","राज्यसभा के 1/4 सदस्य","लोकसभा के 100 सदस्य","कोई न्यूनतम संख्या तय नहीं"],"a":3,"s":"PGT 2016","f":0},{"q":"उपराष्ट्रपति अपने पद पर तब तक बना रहता है जब तक उसका उत्तराधिकारी पद ग्रहण न कर ले—","o":["अनुच्छेद 67(ग)","अनुच्छेद 68(1)","अनुच्छेद 69","अनुच्छेद 70"],"a":0,"s":"PGT 2011","f":0},{"q":"यदि राष्ट्रपति और उपराष्ट्रपति दोनों का पद एक साथ रिक्त हो जाए, तो राष्ट्रपति का कार्य कौन करेगा?","o":["लोकसभा अध्यक्ष","भारत का मुख्य न्यायाधीश (CJI)","प्रधानमंत्री","भारत का महान्यायवादी"],"a":1,"s":"TGT 2003, 2011","f":0},{"q":"किस अधिनियम द्वारा राष्ट्रपति उत्तराधिकार का क्रम निर्धारित किया गया है?","o":["राष्ट्रपति उत्तराधिकार अधिनियम, 1952","राष्ट्रपति उत्तराधिकार अधिनियम, 1969","पीपुल्स रिप्रेजेंटेशन एक्ट, 1951","शासकीय प्रक्रिया नियम, 1971"],"a":1,"s":"PGT 2010","f":0},{"q":"किस संविधान संशोधन द्वारा यह तय हुआ कि राष्ट्रपति मंत्रिपरिषद की सलाह पर ही कार्य करेगा?","o":["24वां संशोधन","42वां संशोधन (1976)","44वां संशोधन","52वां संशोधन"],"a":1,"s":"TGT 2009","f":0},{"q":"44वें संशोधन (1978) द्वारा अनुच्छेद 74(1) में कौन-सा नया परंतु जोड़ा गया?","o":["वीटो का पूर्ण अधिकार","सलाह को एक बार पुनर्विचार हेतु लौटाना","सलाह मानने की बाध्यता समाप्त","मंत्रिमंडल का लिखित परामर्श"],"a":1,"s":"PGT 2013","f":0},{"q":"यदि राष्ट्रपति द्वारा पुनर्विचार हेतु लौटाई गई सलाह को मंत्रिपरिषद पुनः भेज दे, तब राष्ट्रपति—","o":["पुनः लौटा सकता है","मानने हेतु बाध्य है","सुप्रीम कोर्ट भेजेगा","6 माह तक रोक सकता है"],"a":1,"s":"TGT 2016","f":0},{"q":"मंत्रियों द्वारा राष्ट्रपति को दी गई सलाह की जांच न्यायालय द्वारा क्यों नहीं की जा सकती?","o":["अनुच्छेद 74(2) के प्रतिषेध के कारण","अनुच्छेद 75(1) के कारण","संसदीय संप्रभुता के कारण","न्यायालय का अधिकार नहीं है"],"a":0,"s":"PGT 2005","f":0},{"q":"अनुच्छेद 75(2) के अनुसार केंद्रीय मंत्री किसके प्रसादपर्यंत पद धारण करते हैं?","o":["संसद के","प्रधानमंत्री के","राष्ट्रपति के","लोकसभा के"],"a":2,"s":"TGT 2011","f":0},{"q":"मंत्रिपरिषद में मंत्रियों की कितनी श्रेणियां होती हैं?","o":["दो (कैबिनेट व राज्य)","तीन (कैबिनेट, राज्य, उपमंत्री)","चार (संसदीय सचिव सहित)","केवल एक (कैबिनेट)"],"a":1,"s":"TGT 2004","f":0},{"q":"मंत्रिमंडल (Cabinet) की बैठकों की अध्यक्षता कौन करता है?","o":["राष्ट्रपति","प्रधानमंत्री","कैबिनेट सचिव","गृह मंत्री"],"a":1,"s":"TGT 2001","f":0},{"q":"प्रधानमंत्री के त्यागपत्र या आकस्मिक मृत्यु हो जाने पर मंत्रिपरिषद पर क्या प्रभाव पड़ ता है?","o":["वरिष्ठ मंत्री कार्यवाहक बनता है","मंत्रिपरिषद स्वतः भंग हो जाती है","लोकसभा भंग हो जाती है","राष्ट्रपति शासन लग जाता है"],"a":1,"s":"PGT 2011","f":0},{"q":"'कैबिनेट जहाज का पतवार है' (Steering Wheel of the Ship of State) किसने कहा था?","o":["रैम्जे म्योर (Ramsay Muir)","लास्की","लॉर्ड मार्ले","डाइसी"],"a":0,"s":"PGT 2003, 2016","f":0},{"q":"'कैबिनेट वह धुरी है जिस पर संपूर्ण राजनीतिक चक्र घूमता है' किसका कथन है?","o":["ग्लेडस्टोन","सर जॉन मैरियट (John Marriott)","आइवर जेनिंग्स","बेजहॉट"],"a":1,"s":"PGT 2009","f":0},{"q":"भारत का मुख्य विधिक सलाहकार (First Law Officer of Govt.) कौन होता है?","o":["विधि मंत्री","भारत का महान्यायवादी (AG)","सॉलिसिटर जनरल","सुप्रीम कोर्ट का मुख्य न्यायाधीश"],"a":1,"s":"TGT 2013","f":0},{"q":"भारत के महान्यायवादी की सहायता हेतु किसकी नियुक्ति की जाती है?","o":["सॉलिसिटर जनरल व अपर सॉलिसिटर जनरल","विधि आयोग अध्यक्ष","मुख्य चुनाव आयुक्त","लोकपाल"]
